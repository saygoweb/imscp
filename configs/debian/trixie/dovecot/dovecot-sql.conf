# DOVECOT(1) SQL configuration file - auto-generated by i-MSCP
#     DO NOT EDIT THIS FILE BY HAND -- YOUR CHANGES WILL BE OVERWRITTEN
#
# Dovecot 2.4 changed how SQL authentication is declared. In 2.3 this file held
# a connect string plus password_query/user_query and was pulled in through the
# passdb 'args' setting. In 2.4 the driver, connection and queries all belong
# inside the passdb/userdb block itself, and the connection is a named list
# filter ('mysql <name> { .. }'), so the whole block lives here rather than in
# dovecot.conf. That also keeps the database credentials in the file that
# i-MSCP installs without world-read permission.
#
# The 2.3 %u variable no longer exists: 2.4 uses %{user}, and an unknown
# variable is a fatal error rather than an empty expansion.

passdb imscp_sql {
    driver = sql
    sql_driver = mysql

    mysql imscp {
        mysql_host = {DATABASE_HOST}
        mysql_port = {DATABASE_PORT}
        mysql_dbname = {DATABASE_NAME}
        mysql_user = {DATABASE_USER}
        mysql_password = {DATABASE_PASSWORD}
    }

    passdb_default_password_scheme = SHA512-CRYPT

    passdb_sql_query = \
        SELECT \
            CONCAT('{MTA_VIRTUAL_MAIL_DIR}/', SUBSTRING(mail_addr, LOCATE('@', mail_addr) + 1), '/', mail_acc, '/') AS 'userdb_home', \
            '{MTA_MAILBOX_UID}' AS 'userdb_uid', \
            '{MTA_MAILBOX_GID}' AS 'userdb_gid', \
            CONCAT('*:bytes=', quota, 'B') AS userdb_quota_rule, \
            mail_pass AS password \
        FROM mail_users \
        WHERE mail_addr = '%{user}' \
        AND status = 'ok' \
        AND po_active = 'yes'
}

userdb imscp_prefetch {
    driver = prefetch
}

userdb imscp_sql {
    driver = sql
    sql_driver = mysql

    mysql imscp {
        mysql_host = {DATABASE_HOST}
        mysql_port = {DATABASE_PORT}
        mysql_dbname = {DATABASE_NAME}
        mysql_user = {DATABASE_USER}
        mysql_password = {DATABASE_PASSWORD}
    }

    userdb_sql_query = \
        SELECT \
            CONCAT('{MTA_VIRTUAL_MAIL_DIR}/', SUBSTRING(mail_addr, LOCATE('@', mail_addr) +1), '/', mail_acc, '/') AS home, \
            '{MTA_MAILBOX_UID}' AS 'uid', \
            '{MTA_MAILBOX_GID}' AS 'gid', \
            CONCAT('*:bytes=', quota, 'B') AS 'quota_rule' \
        FROM mail_users \
        WHERE mail_addr = '%{user}' \
        AND status = 'ok' \
        AND po_active = 'yes'

    userdb_sql_iterate_query = \
        SELECT mail_addr AS user FROM mail_users \
        WHERE mail_type LIKE '%%_mail%%' && status <> 'todelete'
}
