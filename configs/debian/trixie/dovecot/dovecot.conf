# DOVECOT(1) configuration file - auto-generated by i-MSCP
#     DO NOT EDIT THIS FILE BY HAND -- YOUR CHANGES WILL BE OVERWRITTEN
#
# You can override default settings by adding *.conf configuration files into
# the /etc/dovecot/imscp.d/ configuration directory.
#
# Dovecot 2.4 (Debian 13) uses a configuration language that is not compatible
# with the 2.2/2.3 one used by the other supported distributions, which is why
# this file exists separately from configs/debian/default.

# Dovecot 2.4 requires these to be the first two settings.
dovecot_config_version = 2.4.1
dovecot_storage_version = 2.4.1

# Defaults

default_client_limit = {DOVECOT_DEFAULT_CLIENT_LIMIT}

# Mail location
#
# 2.4 replaced 'mail_location = maildir:~/' with discrete settings.
mail_driver = maildir
mail_path = ~/

# Namespaces

namespace inbox {
    separator = .
    prefix = INBOX.
    inbox = yes
    type = private

    mailbox Drafts {
        special_use = \Drafts
        auto = subscribe
    }

    mailbox Junk {
        special_use = \Junk
        auto = subscribe
    }

    mailbox Sent {
        special_use = \Sent
        auto = subscribe
    }

    mailbox Trash {
        special_use = \Trash
        auto = subscribe

        # 2.3 expressed the extra Trash allowance as a second quota rule
        # ('INBOX.Trash:storage=+100M'). In 2.4 it belongs to the mailbox
        # itself: a mailbox filter inside the quota block cannot be resolved.
        quota_storage_extra = 100M
    }
}

# Quota
#
# 2.4 removed the plugin {} block: its settings are global now, and quota is
# configured through named quota filters rather than a 'quota = <driver>:<name>'
# string. The default rule is carried by the user_quota filter, with the
# per-mailbox Trash allowance expressed as a mailbox filter.

mail_plugins {
    quota = yes
}

quota user_quota {
    quota_driver = maildir
    quota_storage_size = 1G
}

# 2.3 packed resource, threshold and script into one string
# ('storage=95%% quota-warning 95 %u'); 2.4 splits them, and the script is
# addressed through the named execute block that maps onto the quota-warning
# service defined further down. %u is now %{user}.

quota_warning warn95 {
    quota_warning_resource = storage
    quota_warning_threshold = over
    quota_storage_percentage = 95

    execute quota-warning {
        args = 95 %{user}
    }
}

quota_warning warn80 {
    quota_warning_resource = storage
    quota_warning_threshold = over
    quota_storage_percentage = 80

    execute quota-warning {
        args = 80 %{user}
    }
}

# Authentication
#
# 2.4 requires passdb and userdb sections to be named, and the SQL driver,
# connection and queries now live inside those sections rather than in a file
# referenced through the passdb 'args' value. The sections therefore live in
# dovecot-sql.conf, which i-MSCP installs without world-read permission
# because it carries the database credentials.

!include {DOVECOT_CONF_DIR}/dovecot-sql.conf

auth_mechanisms = plain login
auth_allow_cleartext = yes

# Services
#
# 2.4 renamed service { service_count } to service_restart_request_count.

service auth {
    unix_listener auth-master {
        mode = 0600
        user = {MTA_MAILBOX_UID_NAME}
    }

    unix_listener {DOVECOT_SASL_AUTH_SOCKET_PATH} {
        mode = 0660
        user = {POSTFIX_USER}
        group = {POSTFIX_GROUP}
    }
}

service imap-login {
    process_limit = {DOVECOT_IMAP_LOGIN_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_IMAP_LOGIN_PROCESS_MIN_AVAIL}
    service_restart_request_count = {DOVECOT_IMAP_LOGIN_PROCESS_SERVICE_COUNT}
}

service imap {
    process_limit = {DOVECOT_IMAP_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_IMAP_PROCESS_MIN_AVAIL}
    service_restart_request_count = {DOVECOT_IMAP_PROCESS_SERVICE_COUNT}
    vsz_limit = {DOVECOT_IMAP_VSZ_LIMIT}
}

service pop3-login {
    process_limit = {DOVECOT_POP3_LOGIN_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_POP3_LOGIN_PROCESS_MIN_AVAIL}
    service_restart_request_count = {DOVECOT_POP3_LOGIN_PROCESS_SERVICE_COUNT}
}

service pop3 {
    process_limit = {DOVECOT_POP3_PROCESS_LIMIT}
    process_min_avail = {DOVECOT_POP3_PROCESS_MIN_AVAIL}
    service_restart_request_count = {DOVECOT_POP3_PROCESS_SERVICE_COUNT}
}

service quota-warning {
    executable = script {ENGINE_ROOT_DIR}/quota/imscp-dovecot-quota.sh
    group = {IMSCP_GROUP}

    unix_listener quota-warning {
        mode = 0600
        user = {MTA_MAILBOX_UID_NAME}
    }
}

listen = {NETWORK_PROTOCOLS}
mail_max_userip_connections = {DOVECOT_MAX_USERIP_CONNECTIONS}

# 2.4 no longer enables any protocol by default, but the .protocol files
# shipped by the dovecot-imapd/pop3d/managesieved packages already declare
# them in the new boolean-list form, so the set stays tied to what is actually
# installed. Naming protocols here instead would enable ones without a binary
# (lmtp is not installed) and dovecot refuses to start in that case.
!include_try /usr/share/dovecot/protocols.d/*.protocol
!include_try {DOVECOT_CONF_DIR}/imscp.d/*.conf

protocol imap {
    mail_plugins {
        imap_quota = yes
    }
}

protocol lda {
    postmaster_address = postmaster@{HOSTNAME}
}
