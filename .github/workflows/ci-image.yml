name: CI image

# Builds ghcr.io/saygoweb/imscp-ci: this repository installed into the docker/
# development image and committed, so that plugin CI (plugin-test.yml) boots an
# installed i-MSCP in seconds instead of installing one for half an hour. See
# docker/ci/build-image.sh.
#
#   main                 -> :bookworm and :bookworm-<sha>
#   a same-repo PR       -> :pr-<number>, for trying plugin CI against the change
#   weekly               -> :bookworm again, so the image does not fall behind
#                           the Debian and sury archives

on:
  push:
    branches:
      - main
    paths:
      - autoinstaller/**
      - configs/**
      - docker/**
      - engine/**
      - gui/**
      - imscp-autoinstall
      - .github/workflows/ci-image.yml
  pull_request:
    paths:
      - autoinstaller/**
      - configs/**
      - docker/**
      - engine/**
      - gui/**
      - imscp-autoinstall
      - .github/workflows/ci-image.yml
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/saygoweb/imscp-ci

jobs:
  build:
    # A fork's pull request gets no package write token; there is nothing to
    # publish it to.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      # The build image, the installed container and the commit together need
      # more than the runner leaves free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Choose tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
              echo "tags=$IMAGE:pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"
          else
              echo "tags=$IMAGE:bookworm $IMAGE:bookworm-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and install
        run: docker/ci/build-image.sh ${{ steps.tags.outputs.tags }}

      - name: Smoke test
        run: |
          set -- ${{ steps.tags.outputs.tags }}
          docker/ci/smoke-test.sh "$1"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          for tag in ${{ steps.tags.outputs.tags }}; do
              docker push "$tag"
          done
